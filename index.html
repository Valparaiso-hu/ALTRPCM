<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altamar RolePlay Community</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            /* Fondo con la imagen solicitada y capa oscura translúcida */
            background: linear-gradient(rgba(6, 9, 19, 0.75), rgba(6, 9, 19, 0.85)), 
                        url('https://cdn.discordapp.com/attachments/1527876767199662181/1559632180899225601/ENCUESTA_APERTURA.png?ex=6acfc828&is=6ace76a8&hm=ada53ea4278453a5add8158357a7c96a2bc2be50e11e12e696245cd780a463c3&');
            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background-color: rgba(13, 20, 36, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .server-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .login-card h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            border: none;
            padding: 0;
            color: var(--text-main);
        }

        .login-hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .login-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #5865F2;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s, transform 0.1s;
            flex: 1;
        }

        .btn-discord:hover {
            background-color: #4752C4;
        }

        .btn-discord svg {
            width: 18px;
            height: 18px;
            fill: white;
            flex-shrink: 0;
        }

        .btn-join {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-join:hover {
            background-color: var(--border-color);
            border-color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo oficial de Altamar RolePlay -->
            <img src="https://cdn.discordapp.com/icons/1138972937727250472/ec8e4bc0cabd5a44d026473ccad75d79.png?size=2048" alt="Altamar RolePlay Logo" class="server-logo">
            
            <h2>Altamar RolePlay - Información</h2>
            
            <p class="login-hint">
                Dentro de esta web tendrás acceso a todas las normativas del servidor y sus informaciones, Ingresa y descubre todas nuestras funciones y normativas.
            </p>

            <!-- Botones de Acceso y Unirse -->
            <div class="login-buttons">
                <a href="https://discord.gg/2CD4DW3j5n" target="_blank" class="btn-join">
                    Unirse al Servidor
                </a>
                
                <a href="#" id="loginBtn" class="btn-discord">
                    <svg viewBox="0 0 127.14 96.36">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6,5.4,80.21h0A105.73,105.73,0,0,0,39.79,96.27,77.77,77.77,0,0,0,48.1,81.3a68.63,68.63,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.69,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,8.31,14.95,105.25,105.25,0,0,0,34.41-16.06c8.11-26.23-3.05-50.08-19.14-66.1ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.14,46,96.11,53,90.94,65.69,84.69,65.69Z"/>
                    </svg>
                    Acceder
                </a>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '1548726840904917002'; 
        const REDIRECT_URI = 'https://altrpcm.netlify.app/normativa';

        document.getElementById('loginBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const discordOAuthUrl = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds%20guilds.members.read`;
            window.location.href = discordOAuthUrl;
        });
    </script>
</body>
</html>
